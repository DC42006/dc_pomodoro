<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <div id="notif" class="notification-bar"></div>

      
      <div class="modes">
        <button class="mode-btn active" onclick="setMode('pomo')">Focus</button>
        <button class="mode-btn" onclick="setMode('short')">Short Break</button>
        <button class="mode-btn" onclick="setMode('long')">Long Break</button>
      </div>

      
      <div class="ring-wrap">
        <svg class="ring" width="220" height="220" viewBox="0 0 220 220">
          <circle class="ring-bg"       cx="110" cy="110" r="100" />
          <circle class="ring-progress" cx="110" cy="110" r="100"
                  id="ring"
                  stroke-dasharray="628.3"
                  stroke-dashoffset="0" />
        </svg>
        <div class="ring-inner">
          <div class="time-display" id="time">25:00</div>
          <div class="session-info" id="session-info">Session 1</div>
        </div>
      </div>

     
      <div class="dot-row" id="dot-row">
        <div class="dot" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
      </div>

     
      <div class="controls">
        <button class="btn" onclick="resetTimer()">Reset</button>
        <button class="btn primary" id="start-btn" onclick="toggleTimer()">Start</button>
        <button class="btn" onclick="skipSession()">Skip</button>
      </div>

      
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-val" id="stat-done">0</div>
          <div class="stat-lbl">Done</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-focus">0m</div>
          <div class="stat-lbl">Focused</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-streak">0</div>
          <div class="stat-lbl">Streak</div>
        </div>
      </div>

      
      <div class="task-row">
        <input
          class="task-input"
          id="task-input"
          placeholder="What are you working on?"
          onkeydown="if(event.key==='Enter') addTask()"
        />
        <button class="add-btn" onclick="addTask()">+</button>
      </div>

      <!-- Task list -->
      <ul class="task-list" id="task-list"></ul>

    </div>

    <script src="script.js"></script>
  </body>
</html>
